<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversation archives</title>
<style>
:root{color-scheme:dark;--bg:#0b0a15;--panel:#131120;--line:#2c2740;
  --ink:#eae3d2;--dim:#8b829d;--accent:#c9ab77;--accent2:#f6ead0;
  --warn:#d97b6c;--good:#84b98f;--radius:16px;
  --font-ui:'Source Serif 4',Georgia,serif;--font-display:'Cormorant Garamond',Georgia,serif;
  --font-mono:'IBM Plex Mono',Consolas,monospace}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--accent) color-mix(in srgb,var(--panel) 82%,var(--bg))}
html,body{height:100%;margin:0}body{background:radial-gradient(circle at 16% -8%,color-mix(in srgb,var(--line) 55%,var(--bg)),transparent 38%),var(--bg);color:var(--ink);font:16px/1.5 var(--font-ui)}
button,input,select{font:inherit}button{cursor:pointer}.shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);padding:clamp(14px,2vw,26px);gap:14px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}.title{min-width:min(100%,300px);flex:1}.title h1{margin:0;color:var(--accent2);font:600 clamp(1.5rem,3vw,2.25rem)/1.05 var(--font-display)}
.title p{margin:.35rem 0 0;color:var(--dim);max-width:760px}.controls{display:flex;align-items:end;gap:8px;flex-wrap:wrap}.controls label{display:grid;gap:3px;color:var(--dim);font-size:.75rem}
input,select,button,.open-tab{border:1px solid var(--line);border-radius:9px;background:color-mix(in srgb,var(--panel) 88%,var(--bg));color:var(--ink);padding:7px 9px}
input{width:min(320px,72vw)}button:hover,.open-tab:hover{border-color:var(--accent);color:var(--accent2)}button:disabled{opacity:.45;cursor:default}
.workspace{min-height:0;display:grid;grid-template-columns:minmax(250px,31%) minmax(0,1fr);gap:12px}.card{min-height:0;border:1px solid var(--line);border-radius:var(--radius);background:color-mix(in srgb,var(--panel) 92%,transparent);overflow:hidden}
.index{display:grid;grid-template-rows:auto minmax(0,1fr) auto}.index-head,.reader-head{padding:10px 13px;border-bottom:1px solid var(--line);color:var(--dim);font-size:.78rem}.days{overflow:auto;padding:8px;display:grid;align-content:start;gap:7px}
.day-card{display:grid;gap:5px;text-align:left;width:100%;padding:11px 12px;background:color-mix(in srgb,var(--bg) 55%,var(--panel));border-color:transparent}.day-card.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}.day-title{display:flex;justify-content:space-between;gap:8px;color:var(--accent2);font:600 .96rem var(--font-display)}
.day-meta{color:var(--accent);font:11px/1.35 var(--font-mono)}.day-preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim);font-size:.78rem}.pager{display:flex;justify-content:center;padding:9px;border-top:1px solid var(--line)}
.reader{display:grid;grid-template-rows:auto minmax(0,1fr)}.reader-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.reader-head .meta{flex:1;min-width:160px}.open-tab{text-decoration:none;font-size:.76rem;padding:5px 8px}.reader-body{overflow:auto;padding:clamp(16px,3vw,34px)}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--dim);padding:28px}.day-transcript{max-width:920px;margin:0 auto}.day-transcript>h2{margin:0;color:var(--accent2);font:600 1.55rem var(--font-display)}.day-summary{color:var(--dim);font:12px var(--font-mono);margin:.35rem 0 1.4rem}
.day-entry{padding:0 0 22px;margin:0 0 22px;border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent)}.day-entry:last-of-type{border-bottom:0}.entry-meta{display:flex;gap:8px;justify-content:space-between;color:var(--dim);font:11px/1.35 var(--font-mono);margin:0 2px 8px}.entry-meta span:last-child{text-align:right}
.speech{margin:0 0 10px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:color-mix(in srgb,var(--bg) 54%,var(--panel))}.speech.reply{margin-left:clamp(12px,4vw,44px);border-left:3px solid var(--accent)}.speech h3{margin:0 0 7px;color:var(--accent);font:600 .8rem var(--font-display);font-variant:small-caps;letter-spacing:.06em}.speech-content{white-space:pre-wrap;overflow-wrap:anywhere}.details{color:var(--warn);font-size:.82rem;margin-top:8px}.images{color:var(--dim);font-size:.78rem;margin-top:7px}.nav{display:flex;gap:8px;margin-top:20px}.nav button:last-child{margin-left:auto}.quiet{color:var(--dim)}
@media(max-width:760px){.shell{height:auto;min-height:100%}.workspace{grid-template-columns:1fr;grid-template-rows:minmax(260px,38vh) minmax(440px,auto)}.reader-body{overflow:visible}.card{min-height:0}.speech.reply{margin-left:8px}}
</style>
</head>
<body>
<main class="shell">
  <header class="head">
    <div class="title">
      <h1>Conversation archives</h1>
      <p>Choose a day and read its complete conversation history. Persona chats stay separate from Nexus room speech.</p>
    </div>
    <div class="controls">
      <label>whose conversations<select id="owner"></select></label>
      <label>find a day<input id="search" type="search" placeholder="words, speaker, or date"></label>
      <button id="searchButton" type="button">search</button>
    </div>
  </header>
  <section class="workspace">
    <aside class="card index">
      <div class="index-head" id="archiveStatus">opening the archive boundary…</div>
      <div class="days" id="days"></div>
      <div class="pager"><button id="more" type="button" hidden>load earlier days</button></div>
    </aside>
    <section class="card reader">
      <div class="reader-head">
        <span class="meta" id="readerMeta">Choose a day.</span>
        <a class="open-tab" id="openTab" href="/conversation-archives" target="_blank" rel="noopener" hidden>open day separately ↗</a>
      </div>
      <div class="reader-body" id="reader"><div class="empty">Opening a day is human reading only. Nothing here is admitted into memory or circulated.</div></div>
    </section>
  </section>
</main>
<script>
const ARCHIVE_TOKEN=/*ARCHIVE_TOKEN*/;
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const ARCHIVE_TIMEZONE=Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC";
const state={owner:params.get("owner")||localStorage.getItem("jnaiq.archive.owner")||"nexus",query:"",offset:0,limit:45,totalDays:0,days:[],selectedDay:params.get("day")||"",loadGeneration:0,detailGeneration:0,legacyMode:false,legacyAll:[],legacyDayKeys:[],ownerInfo:null};
const FONT_STACKS={system:'"Segoe UI",system-ui,sans-serif',serif:'"Source Serif 4",Georgia,serif',display:'"Cormorant Garamond",Georgia,serif',mono:'"IBM Plex Mono",Consolas,monospace',humanist:'"Atkinson Hyperlegible","Segoe UI",sans-serif',rounded:'Nunito,"Segoe UI",sans-serif',geometric:'"Space Grotesk","Segoe UI",sans-serif'};
function applyTheme(tokens){if(!tokens)return;const root=document.documentElement;for(const key of ["bg","panel","line","ink","dim","accent","accent2","warn","good"])if(tokens[key])root.style.setProperty(`--${key}`,tokens[key]);if(tokens.radius!=null)root.style.setProperty("--radius",`${tokens.radius}px`);root.style.setProperty("--font-ui",FONT_STACKS[tokens.font]||FONT_STACKS.serif)}
window.addEventListener("message",event=>{if(event.data?.type==="jnaiq-theme-refresh")applyTheme(event.data.tokens)});
try{parent.postMessage({type:"jnaiq-theme-request"},"*")}catch(_error){}
fetch("/api/ui/theme").then(response=>response.json()).then(data=>applyTheme(data.tokens)).catch(()=>{});
async function request(url){const response=await fetch(url,{headers:{"X-JNAIQ-Archive-Token":ARCHIVE_TOKEN},credentials:"same-origin",cache:"no-store"});let body={};try{body=await response.json()}catch(_error){}if(!response.ok||body.error){const error=new Error(body.error||`${response.status} ${response.statusText}`);error.status=response.status;throw error}return body}
function archiveDate(value){if(value==null||value==="")return new Date(NaN);if(typeof value==="number"||/^-?\d+(?:\.\d+)?$/.test(String(value).trim())){let epoch=Number(value);if(Math.abs(epoch)<100000000000)epoch*=1000;return new Date(epoch)}return new Date(value)}
function readableTime(value){if(!value)return "time unknown";const date=archiveDate(value);return Number.isNaN(date.valueOf())?value:date.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}
function readableDay(day){if(day==="unknown")return "Date unknown";const date=new Date(`${day}T12:00:00`);return Number.isNaN(date.valueOf())?day:date.toLocaleDateString([], {weekday:"long",year:"numeric",month:"long",day:"numeric"})}
function localDay(value){const date=archiveDate(value);if(Number.isNaN(date.valueOf()))return String(value||"").slice(0,10)||"unknown";const parts=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:ARCHIVE_TIMEZONE,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date).filter(part=>part.type!=="literal").map(part=>[part.type,part.value]));return `${parts.year}-${parts.month}-${parts.day}`}
function setPermalink(){const next=new URLSearchParams();next.set("owner",state.owner);if(state.selectedDay)next.set("day",state.selectedDay);history.replaceState(null,"",`${location.pathname}?${next}`);$("openTab").href=`/conversation-archives?${next}`}
function renderDays(){const host=$("days");host.replaceChildren();if(!state.days.length){const empty=document.createElement("div");empty.className="empty";empty.textContent=state.query?"No days contain that search.":"No completed conversation days are recorded here yet.";host.appendChild(empty);return}for(const item of state.days){const button=document.createElement("button");button.type="button";button.className=`day-card${item.day===state.selectedDay?" on":""}`;const title=document.createElement("div");title.className="day-title";const date=document.createElement("span");date.textContent=readableDay(item.day);const count=document.createElement("span");count.textContent=`${item.entry_count}`;title.append(date,count);const meta=document.createElement("div");meta.className="day-meta";meta.textContent=`${item.entry_count} entr${item.entry_count===1?"y":"ies"}${state.query?` · ${item.matching_entry_count} matched`:""} · ${item.speakers.join(" / ")||"speakers unknown"}`;const preview=document.createElement("div");preview.className="day-preview";preview.textContent=item.latest_preview||"(no text preview)";button.append(title,meta,preview);button.onclick=()=>openDay(item.day);host.appendChild(button)}}
function speechBlock(label,text,kind){const block=document.createElement("section");block.className=`speech ${kind}`;const heading=document.createElement("h3");heading.textContent=label;const content=document.createElement("div");content.className="speech-content";content.textContent=text||"(no text recorded)";block.append(heading,content);return block}
function renderDay(data){const reader=$("reader");reader.replaceChildren();const article=document.createElement("article");article.className="day-transcript";const heading=document.createElement("h2");heading.textContent=readableDay(data.day);const summary=document.createElement("div");summary.className="day-summary";summary.textContent=`${data.owner.label} · ${data.entry_count} conversation entr${data.entry_count===1?"y":"ies"} · ${data.timezone}`;article.append(heading,summary);for(const item of data.conversations){const entry=document.createElement("section");entry.className="day-entry";entry.title=item.conversation_id;const meta=document.createElement("div");meta.className="entry-meta";const time=document.createElement("span");time.textContent=readableTime(item.started_at);const status=document.createElement("span");status.textContent=`${item.channel} · ${item.status}`;meta.append(time,status);entry.appendChild(meta);entry.appendChild(speechBlock(item.speaker||"Human",item.message,"message"));if(item.reply)entry.appendChild(speechBlock(data.owner.label,item.reply,"reply"));if(item.images?.length){const images=document.createElement("div");images.className="images";images.textContent=`Shared image references: ${item.images.join(", ")}`;entry.appendChild(images)}if(item.error||item.interruption_reason){const detail=document.createElement("div");detail.className="details";detail.textContent=item.error?`${item.error_type||"Failure"}: ${item.error}`:`Interrupted: ${item.interruption_reason}`;entry.appendChild(detail)}article.appendChild(entry)}const nav=document.createElement("div");nav.className="nav";const newer=document.createElement("button");newer.type="button";newer.textContent="← newer day";newer.disabled=!data.newer_day;newer.onclick=()=>openDay(data.newer_day);const older=document.createElement("button");older.type="button";older.textContent="older day →";older.disabled=!data.older_day;older.onclick=()=>openDay(data.older_day);nav.append(newer,older);article.appendChild(nav);reader.appendChild(article);$("readerMeta").textContent=`${data.owner.label} · complete day · ${data.entry_count} entries`;$("openTab").hidden=false}
async function legacyEntries(query=""){
  const gathered=[];let offset=0;let owner=null;
  while(true){const url=new URL("/api/conversation-archives",location.origin);url.searchParams.set("owner",state.owner);url.searchParams.set("offset",offset);url.searchParams.set("limit","200");if(query)url.searchParams.set("q",query);const data=await request(url);owner=data.owner;gathered.push(...data.conversations);offset+=data.conversations.length;if(!data.has_more||!data.conversations.length)break}
  return {owner,conversations:gathered}
}
function legacyDayRows(all,matching){const groups=new Map();for(const entry of all){const day=localDay(entry.started_at);if(!groups.has(day))groups.set(day,[]);groups.get(day).push(entry)}const matchingDays=new Map();for(const entry of matching){const day=localDay(entry.started_at);matchingDays.set(day,(matchingDays.get(day)||0)+1)}state.legacyDayKeys=[...groups.keys()].sort().reverse();return state.legacyDayKeys.filter(day=>!state.query||matchingDays.has(day)).map(day=>{const entries=groups.get(day);const speakers=[];for(const entry of [...entries].reverse())if(entry.speaker&&!speakers.includes(entry.speaker))speakers.push(entry.speaker);return {day,entry_count:entries.length,matching_entry_count:state.query?(matchingDays.get(day)||0):entries.length,speakers,first_at:entries.at(-1)?.started_at||"",last_at:entries[0]?.started_at||"",latest_preview:entries[0]?.message_preview||""}})}
async function loadLegacyDays(generation){const allResult=await legacyEntries();const matchingResult=state.query?await legacyEntries(state.query):allResult;if(generation!==state.loadGeneration)return;state.legacyMode=true;state.legacyAll=allResult.conversations;state.ownerInfo=allResult.owner;state.days=legacyDayRows(allResult.conversations,matchingResult.conversations);state.totalDays=state.days.length;state.offset=state.days.length;const totalEntries=state.days.reduce((total,day)=>total+day.entry_count,0);$("archiveStatus").textContent=`${allResult.owner.label} · ${state.days.length} day${state.days.length===1?"":"s"}${state.query?" matching search":""} · ${totalEntries} entries · read-only`;$("more").hidden=true;renderDays();if(state.selectedDay&&state.legacyDayKeys.includes(state.selectedDay))await openDay(state.selectedDay);else if(state.days[0])await openDay(state.days[0].day);else{$("reader").innerHTML='<div class="empty">There is no completed conversation day to read in this view.</div>';$("readerMeta").textContent="No day selected.";$("openTab").hidden=true}}
async function legacyDayDetail(day,generation){const entries=state.legacyAll.filter(entry=>localDay(entry.started_at)===day).sort((a,b)=>archiveDate(a.started_at)-archiveDate(b.started_at));const detailed=new Array(entries.length);let cursor=0;const concurrency=Math.max(4,Math.min(16,navigator.hardwareConcurrency||8));async function worker(){while(cursor<entries.length){const index=cursor++;const id=entries[index].conversation_id;const data=await request(`/api/conversation-archives/${encodeURIComponent(state.owner)}/conversation/${encodeURIComponent(id)}`);detailed[index]=data.conversation}}await Promise.all(Array.from({length:Math.min(concurrency,entries.length)},worker));if(generation!==state.detailGeneration)return;const index=state.legacyDayKeys.indexOf(day);renderDay({owner:state.ownerInfo,timezone:ARCHIVE_TIMEZONE,day,entry_count:detailed.length,conversations:detailed,newer_day:index>0?state.legacyDayKeys[index-1]:null,older_day:index>=0&&index+1<state.legacyDayKeys.length?state.legacyDayKeys[index+1]:null})}
async function openDay(day){if(!day)return;const generation=++state.detailGeneration;state.selectedDay=day;params.set("owner",state.owner);params.set("day",day);renderDays();setPermalink();$("readerMeta").textContent="opening the complete day…";if(state.legacyMode){try{await legacyDayDetail(day,generation)}catch(error){if(generation===state.detailGeneration)$("readerMeta").textContent=`Could not open day: ${error.message}`}return}const url=new URL(`/api/conversation-archives/${encodeURIComponent(state.owner)}/day/${encodeURIComponent(day)}`,location.origin);url.searchParams.set("timezone",ARCHIVE_TIMEZONE);try{const data=await request(url);if(generation!==state.detailGeneration)return;state.ownerInfo=data.owner;renderDay(data)}catch(error){if(generation===state.detailGeneration)$("readerMeta").textContent=`Could not open day: ${error.message}`}}
async function loadDays(reset=true){const generation=reset?++state.loadGeneration:state.loadGeneration;if(reset){state.offset=0;state.days=[];state.legacyMode=false;state.legacyAll=[];state.selectedDay=params.get("day")&&state.owner===(params.get("owner")||state.owner)?params.get("day"):""}const url=new URL("/api/conversation-archives/days",location.origin);url.searchParams.set("owner",state.owner);url.searchParams.set("offset",state.offset);url.searchParams.set("limit",state.limit);url.searchParams.set("timezone",ARCHIVE_TIMEZONE);if(state.query)url.searchParams.set("q",state.query);$("archiveStatus").textContent="grouping the canonical ledger by day…";try{const data=await request(url);if(generation!==state.loadGeneration)return;state.ownerInfo=data.owner;state.totalDays=data.total_days;state.days.push(...data.days);state.offset=state.days.length;$("archiveStatus").textContent=`${data.owner.label} · ${data.total_days} day${data.total_days===1?"":"s"}${state.query?" matching search":""} · ${data.total_entries} entries · read-only`;$("more").hidden=!data.has_more;renderDays();if(state.selectedDay)await openDay(state.selectedDay);else if(state.days[0])await openDay(state.days[0].day);else{$("reader").innerHTML='<div class="empty">There is no completed conversation day to read in this view.</div>';$("readerMeta").textContent="No day selected.";$("openTab").hidden=true}}catch(error){if(error.status===404&&generation===state.loadGeneration){await loadLegacyDays(generation);return}if(generation===state.loadGeneration){$("archiveStatus").textContent=`Archive unavailable: ${error.message}`;renderDays()}}}
async function loadOwners(){try{const data=await request("/api/conversation-archives/owners");const owner=$("owner");owner.replaceChildren();for(const item of data.owners){const option=document.createElement("option");option.value=item.id;option.textContent=`${item.label}${item.kind==="nexus"?" · shared room":""}${item.has_archive?"":" · no saved days"}`;owner.appendChild(option)}if(!data.owners.some(item=>item.id===state.owner))state.owner=data.owners[0]?.id||"nexus";owner.value=state.owner;owner.onchange=()=>{state.owner=owner.value;localStorage.setItem("jnaiq.archive.owner",state.owner);state.query="";$("search").value="";state.selectedDay="";params.set("owner",state.owner);params.delete("day");setPermalink();loadDays(true)};await loadDays(true)}catch(error){$("archiveStatus").textContent=`Archive index unavailable: ${error.message}`}}
$("searchButton").onclick=()=>{state.query=$("search").value.trim();state.selectedDay="";params.delete("day");setPermalink();loadDays(true)};
$("search").addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();$("searchButton").click()}});
$("more").onclick=()=>loadDays(false);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.owner)loadDays(true)});
loadOwners();
</script>
</body>
</html>
