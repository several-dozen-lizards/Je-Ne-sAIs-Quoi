# gpt-5-6 — GPT-5.6 Sol vessel. The local name remains stable for
# roster/history continuity; the OpenAI API endpoint is the discovered,
# callable variant ID rather than the retired bare gpt-5.6 alias.
identity:
  name: "gpt-5-6"
  family: "openai_chat"
  base_model: "gpt-5.6 Sol"
  provider: "openai_compat"
  endpoint: "gpt-5.6-sol"
  base_url: "https://api.openai.com/v1"
  api_key_env: "OPENAI_API_KEY"
  locality: "api"
context:
  # The gpt-5.6 alias routes to GPT-5.6 Sol. OpenAI documents a
  # 1,050,000-token context window; keep the existing 85% practical margin.
  window_tokens: 1050000
  practical_window_tokens: 892500
  block_budgets: {}
prompt_structure:
  system_prompt: true
  template: "openai_messages"
  strict_alternation: false
  prefill_supported: false
  stop_sequences: []
sampling:
  temperature:
    mode: omit
reasoning:
  effort: low
wire:
  chat_completions:
    # OpenAI streamed responses otherwise omit their final usage object,
    # leaving persona token and cache accounting blank.
    include_stream_usage: true
capabilities:
  tool_use: false
  vision: true
  structured_output: "unknown"
  streaming: true
module_capability:
  validated: []
  saturates_on: []
  ceiling_notes: "unknown — user-added; mapping this ceiling IS the experiment"
runtime:
  gpu_constraints: "unknown (server-side)"
  cost: "depends on server (free local / $ hosted)"
  latency_class: "unknown"
quirks:
  - "stable JNSQ name gpt-5-6 resolves to the discovered gpt-5.6-sol API ID"
  - "Sol, Terra, and Luna are distinct API model IDs, not reasoning-effort settings"
harness:
  last_mechanical_pass: null
  fidelity_floor_results: {}
