# hf-co-thedrummer-anubis-mini-8b-v1-gguf-latest — user-added OpenAI-compatible model, scaffolded by the
# factory 2026-07-30. One wire shape, many servers: LM Studio, llama.cpp,
# vLLM, OpenRouter, Together, Groq. KEY LAW: api_key_env below NAMES
# an environment variable — the value NEVER goes in this file. Local
# servers typically need no key at all (unset env -> no auth header).
# NOTHING here is verified — run the harness MECHANICAL TIER before
# trusting anything (llama3-1-8b's template-risk lesson applies doubly to
# servers that silently apply their own chat template).
identity:
  name: "hf-co-thedrummer-anubis-mini-8b-v1-gguf-latest"
  family: "openai_chat"
  base_model: "hf.co/TheDrummer/Anubis-Mini-8B-v1-GGUF:latest (user-added)"
  provider: "openai_compat"
  service: "ollama"
  endpoint: "hf.co/TheDrummer/Anubis-Mini-8B-v1-GGUF:latest"
  base_url: "http://localhost:11434/v1"
  api_key_env: "OLLAMA_API_KEY"
  locality: "local"
context:
  window_tokens: 8192
  practical_window_tokens: 6963
  # Capacity ceilings, not content targets. Relevance and current state still
  # determine what enters each seat; this vessel declares how much it carries.
  block_budgets:
    just_now: 600
    experiential_continuity: 680
    document_library: 720
    surfaced_memories: 420
prompt_structure:
  system_prompt: true
  template: "openai_messages"
  strict_alternation: false
  prefill_supported: false
  stop_sequences: []
sampling:
  temperature:
    mode: dynamic
    # Preserve the oscillator-derived movement while calibrating it to this
    # model's native 0.6 sampling neighborhood.
    min: 0.52
    max: 0.72
    precision: 2
transport:
  http:
    connect_timeout_s: 10
    read_timeout_s: 600
    write_timeout_s: 60
    pool_timeout_s: 600
wire:
  chat_completions:
    include_stream_usage: true
capabilities:
  tool_use: false
  vision: false
  structured_output: "unknown"
  streaming: true
module_capability:
  validated: []
  saturates_on: []
  ceiling_notes: "unknown — user-added; mapping this ceiling IS the experiment"
runtime:
  gpu_constraints: "unknown (server-side)"
  cost: "depends on server (free local / $ hosted)"
  latency_class: "unknown"
quirks:
  - "user-added via the factory; nothing verified — mechanical tier first"
  - "server may apply its own chat template — watch for template drift"
harness:
  last_mechanical_pass: null
  fidelity_floor_results: {}
