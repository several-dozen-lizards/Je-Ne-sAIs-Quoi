# Kimi K3 — Moonshot AI's long-context flagship. Registered from the
# platform's 2026-09-21 API contract; live account access remains unverified.
identity:
  name: "kimi-k3"
  family: "openai_chat"
  base_model: "Kimi K3"
  provider: "openai_compat"
  service: "moonshot"
  endpoint: "kimi-k3"
  base_url: "https://api.moonshot.ai/v1"
  api_key_env: "MOONSHOT_API_KEY"
  token_limit_param: "max_completion_tokens"
  locality: "api"
context:
  window_tokens: 1000000
  practical_window_tokens: 850000
  block_budgets: {}
prompt_structure:
  system_prompt: true
  template: "openai_messages"
  strict_alternation: false
  prefill_supported: true
  stop_sequences: []
sampling:
  temperature:
    mode: omit
  top_p:
    mode: omit
reasoning:
  effort: low
wire:
  chat_completions:
    include_stream_usage: true
capabilities:
  tool_use: false
  vision: true
  structured_output: "unknown"
  streaming: true
module_capability:
  validated: []
  saturates_on: []
  ceiling_notes: "registered from provider documentation; JNAIQ behavioral ceiling not yet measured"
runtime:
  gpu_constraints: "server-side"
  cost: "$0.30 cached input / $3.00 input / $15.00 output per MTok (Kimi, checked 2026-09-21)"
  latency_class: "unknown"
quirks:
  - "always-thinking model; reasoning effort supports low, high, or max"
  - "provider fixes temperature=1.0 and top_p=0.95, so JNAIQ omits both controls"
  - "tool use stays disabled until JNAIQ can preserve the provider's reasoning_content across tool rounds"
harness:
  last_mechanical_pass: null
  fidelity_floor_results: {}
