# moondream-ollama - narrow local visual transducer.
identity:
  name: "moondream-ollama"
  family: "llama3-chatml"
  base_model: "Moondream"
  provider: "ollama"
  service: "ollama"
  endpoint: "moondream:latest"
  locality: "local"
context:
  window_tokens: 2048
  practical_window_tokens: 1536
  block_budgets: {}
prompt_structure:
  system_prompt: true
  template: "openai_messages"
  strict_alternation: false
  prefill_supported: false
  stop_sequences: []
sampling:
  temperature:
    mode: "fixed"
    value: 0.0
wire:
  ollama:
    # The ambient eye must not displace the resident's speaking vessel from
    # the 8 GiB GPU. Its own weights are released after each admitted event.
    num_gpu: 0
    keep_alive: 0
capabilities:
  tool_use: false
  vision: true
  structured_output: "unknown"
  streaming: false
module_capability:
  validated: []
  saturates_on: []
  ceiling_notes: "ambient observable-feature transduction only"
runtime:
  gpu_constraints: "CPU-bound by spec; must not allocate resident VRAM"
  cost: "free_local"
  latency_class: "about 18s on generated 3D fixture when CPU-bound"
  vision_max_tokens: 180
quirks:
  - "Descriptions are observations, not authoritative room geometry"
  - "Fixture fidelity is insufficient for canonical spatial grounding"
harness:
  last_mechanical_pass: "2026-08-05"
  fidelity_floor_results:
    generated_3d_fixture: "partial: found three forms; spatial/color errors"
